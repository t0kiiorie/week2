<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Week 2</title>
</head>
<body>

    <div class="container">
        <h3>Pick your favorite color</h3>
        <h4>If you only like a specific shade, then still pick the color of the shade, example: maroon is a shade of red.</h4>
        <h5>If you have multiple, then you can combine the results as you like.</h5>
        <select name="colors" id="colors">
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="yellow">Yellow</option>
            <option value="orange">Orange</option>
            <option value="purple">Purple</option>
            <option value="pink">Pink</option>
            <option value="brown">Brown</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="other">Other</option>
        </select>
        <button>Get results</button>
        <div class="result-container">
            <p class="result"></p>
        </div>
    </div>

</body>

<script src="index.js"></script>

</html>
